<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Call RAG Analytics Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header__inner">
                <div class="logo">SC</div>
                <div>
                    <h1>Sales Call RAG Analytics Assistant</h1>
                    <p class="subtitle">Ask about your sales calls — answered from the internal knowledge base and call metadata.</p>
                </div>
            </div>
        </header>

        <main class="container">
            <section class="samples">
                <p class="samples__label">Try one of these:</p>
                <div class="samples__chips" id="sampleChips">
                    <button class="chip">What makes successful calls successful?</button>
                    <button class="chip">Compare successful and unsuccessful calls.</button>
                    <button class="chip">How many calls did Daniel Cohen close?</button>
                    <button class="chip">Show examples of calls that failed because of price concerns.</button>
                    <button class="chip">Find calls where the customer was interested but still did not buy.</button>
                    <button class="chip">What is the overall win rate?</button>
                </div>
            </section>

            <section class="ask">
                <textarea id="questionInput" class="ask__input" rows="3"
                    placeholder="Ask a question about the sales calls..."></textarea>
                <button id="askButton" class="ask__button">Ask</button>
            </section>

            <div id="loading" class="loading hidden">
                <span class="spinner"></span>
                <span>Working on it...</span>
            </div>

            <div id="error" class="error hidden"></div>

            <section id="responsePanel" class="response hidden">
                <div class="response__head">
                    <h2 class="response__title">Answer</h2>
                    <span id="engineBadge" class="badge hidden"></span>
                </div>
                <div id="answer" class="response__answer"></div>

                <div id="citationsWrap" class="citations hidden">
                    <h3 class="citations__title">Sources</h3>
                    <ul id="citations" class="citations__list"></ul>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>Amazon Bedrock Knowledge Base + local analytics &middot; University AI Project</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
